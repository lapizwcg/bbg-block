const has = (n, d, k) => genLevel(n, d).tiles.some(q => q.k === k);
ok('Обычная: 1 — красный, 4 — жёлтый, 7 — белый, 11 фильтр, 16 стекло, 19 призма',
needs(1) === '1' && needs(4) === '3' && needs(7) === '7' && has(11, 'normal', 'filter') && has(16, 'normal', 'split') && has(19, 'normal', 'prism'),
[1, 4, 7].map(n => needs(n)).join(' | '));
ok('карточки: у каждой идеи сцена, заголовок и текст на трёх языках',
Object.keys(SCENES).every(k => LANGS.every(l => STRINGS[l]['i_' + k] && STRINGS[l]['i_' + k + '_t'])));
ok('сцены карточек решены (лучи доходят до своих кристаллов)', Object.keys(SCENES).every(k => {
const sc = SCENES[k], cells = new Map();
for (const [kk, x, y, o] of sc.t) cells.set(K(x, y), { k: kk, x, y, ...o });
return trace({ C: sc.C, H: sc.H, cells, tiles: [...cells.values()] }).win;
}));
const seen = new Set();
for (let n = 1; n <= 200; n++) for (const m of trace(solved(genLevel(n))).mixes) seen.add(mixKey(m.ins));
const miss = BOOK_KEYS.filter(k => !seen.has(k));
ok('все формулы книги встречаются в уровнях 1–200', !miss.length, 'нет: ' + miss.join(' '));
ok('строки: у EN и ES есть всё, что у RU', LANGS.every(l => Object.keys(STRINGS.ru).every(k => STRINGS[l][k])));
const sum = hashStr(Array.from({ length: 100 }, (_, i) => levelSig(genLevel(i + 1))).join('|'));
const fail = res.filter(r => r.startsWith('FAIL'));
console.log(res.join('\n') + '\nсумма уровней 1–100: ' + sum);
return (fail.length ? 'ОШИБКИ: ' + fail.length + ' из ' + res.length : 'ВСЁ OK (' + res.length + ')') + ' ' + sum;
}
let last = 0;
function frame(time) {
requestAnimationFrame(frame);
if (innerWidth !== fitW || innerHeight !== fitH) fit();
const dt = last ? Math.min(0.05, (time - last) / 1000) : 0;
last = time;
update(dt);
draw(time / 1000);
}
if (QS.has('dbg')) {
window.blCheck = blCheck;
window.BL = { genLevel, trace, get L() { return L; }, get TR() { return TR; }, startLevel, rotate, restart, openBook, openSettings, showIntro,
get book() { return book; }, SFX, settings, applyTheme, setLang, DIFFS, solved,
layout: () => ({ LW, LH, OX, BX, BY, T, SCALE, GY }) };
}
addEventListener('resize', fit);
addEventListener('orientationchange', fit);
document.addEventListener('visibilitychange', () => { if (document.hidden) { if (L) save(); SFX.pause(); } });
addEventListener('pagehide', () => { if (L) save(); });
applyTheme(settings.theme);
fit();
if (!DIFFS[settings.diff]) settings.diff = 'normal';
const startN = savedLevel(settings.diff);
const qLvl = parseInt(QS.get('lvl'), 10);
if (qLvl > 0) {
startLevel(qLvl, false);
try { history.replaceState(null, '', location.pathname + location.search.replace(/([?&])lvl=[^&]*&?/, '$1').replace(/[?&]$/, '')); } catch (e) {}
} else startLevel(startN, true);
requestAnimationFrame(frame);
})();
</script>
