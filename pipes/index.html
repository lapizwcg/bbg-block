ok('колбы неподвижны: у всех источников и стоков поворот 0 (300 уровней)',
Array.from({ length: NL }, (_, i) => genLevel(i + 1)).every(A => A.tiles.every(q => q.type === 'pipe' || q.rot === 0)));
let spare = [];
for (let n = 1; n <= 60; n++) {
const A = solved(genLevel(n));
for (const tl of A.tiles) {
if (tl.type !== 'pipe' || rotm(tl.base, 1) === tl.base) continue;
tl.rot = 1;
if (evalLevel(A).win) spare.push(n + ':' + tl.x + ',' + tl.y);
tl.rot = 0;
}
}
ok('в ответе нужна каждая клетка (уровни 1–60)', !spare.length, spare.slice(0, 6).join(' '));
const needOf = n => genLevel(n).tiles.filter(t => t.type === 'sink').map(t => t.need).sort((a, b) => a - b).join(',');
ok('ур. 1 — синий, ур. 3/4/5 — оранжевый/зелёный/фиолетовый',
needOf(1) === '4' && needOf(3) === '3' && needOf(4) === '6' && needOf(5) === '5', [1, 3, 4, 5].map(needOf).join(' | '));
const n9 = needOf(9).split(',');

genLevel(9).tiles.some(t => t.type === 'src' && pop(t.base) >= 2), needOf(9));
ok('ур. 12 — розовый (белый), ур. 25 — коричневый', needOf(12).split(',').includes('9') && needOf(25).split(',').includes('7'),
needOf(12) + ' | ' + needOf(25));
const mk = (C, H, list) => {
const tiles = [];
for (let i = 0; i < C * H; i++) tiles.push(null);
for (const [x, y, type, base, v] of list) tiles[y * C + x] = { x, y, type, base, rot: 0, col: type === 'src' ? v : 0, need: type === 'sink' ? v : 0, anim: 0 };
return { C, H, tiles: tiles.filter(Boolean) };
};
const base = [[0, 0, 'src', 2, 1], [1, 0, 'pipe', 14, 0], [2, 0, 'src', 8, 4], [1, 1, 'sink', 1, 5]];
const e1 = evalLevel(mk(3, 2, base));
ok('К + С в тройнике -> фиолетовый, победа', e1.win && e1.sinks[0].got === 5);

e1.flows.some(f => f.col === 1) && e1.flows.some(f => f.col === 4) && e1.flows.some(f => f.col === 5));
ok('сток ждёт зелёный — не победа', !evalLevel(mk(3, 2, base.map(r => r[2] === 'sink' ? [1, 1, 'sink', 1, 6] : r))).win);
const e3 = evalLevel(mk(3, 2, base.map(r => r[2] === 'pipe' ? [1, 0, 'pipe', 7, 0] : r)));
ok('открытый конец в мокрой сети — протечка', e3.leaks.length > 0 && !e3.win);
ok('красный + белый -> розовый', evalLevel(mk(3, 2, base.map(r => r[0] === 2 ? [2, 0, 'src', 8, 8] : r[2] === 'sink' ? [1, 1, 'sink', 1, 9] : r))).win);
ok('красный + зелёный -> коричневый', evalLevel(mk(3, 2, base.map(r => r[0] === 2 ? [2, 0, 'src', 8, 6] : r[2] === 'sink' ? [1, 1, 'sink', 1, 7] : r))).win);
const star = mk(4, 2, [[0, 0, 'sink', 2, 1], [1, 0, 'src', 10, 1], [2, 0, 'pipe', 14, 0], [3, 0, 'src', 8, 4], [2, 1, 'sink', 1, 5]]);
const e7 = evalLevel(star);
ok('колба с двумя выходами: в колбу вода не втекает (красный и фиолетовый)', e7.win &&
e7.sinks.map(s => s.got).sort().join() === '1,5');
const e8 = evalLevel(mk(3, 2, base.concat([[0, 1, 'pipe', 5, 0]])));
ok('сухая труба на поле — не победа', !e8.win && !e8.allWet);
const ring = mk(3, 3, [[0, 0, 'pipe', 6, 0], [1, 0, 'pipe', 14, 0], [2, 0, 'pipe', 12, 0], [0, 1, 'pipe', 5, 0], [2, 1, 'pipe', 5, 0],
[0, 2, 'pipe', 3, 0], [1, 2, 'pipe', 11, 0], [2, 2, 'pipe', 9, 0], [1, 1, 'src', 5, 2]]);
const e6 = evalLevel(ring);
ok('кольцо труб считается (без стока — не победа)', e6.flows.length > 0 && !e6.win);
const r1 = rekey('1,1:s3', '1,1:'), r2 = rekey('1,1:s9', '1,1:'), r3 = rekey('1,1:3', '1,1:');
ok('поворот уносит воду: колено С-В -> В-Ю без разворота, З-С -> С-В с разворотом, рукав З -> С',
r1.key === '1,1:s6' && !r1.flip && r2.key === '1,1:s3' && r2.flip && r3.key === '1,1:0');
ok('книга: ' + BOOK_KEYS.length + ' формул, без повторов, каждая даёт новый цвет',
new Set(BOOK_KEYS).size === BOOK_KEYS.length && BOOK.every(s => s.items.every(it => !it.includes(orAll(it)))));
const seen = new Set();
for (let n = 1; n <= 200; n++) for (const m of evalLevel(solved(genLevel(n))).mixes) seen.add(mixKey(m.ins));
const miss = BOOK_KEYS.filter(k => !seen.has(k));
ok('все формулы книги встречаются в уровнях 1–200', !miss.length, 'нет: ' + miss.join(' '));
const dBad = [];
for (const d of ['easy', 'hard']) for (let n = 1; n <= 150; n++) {
const A = genLevel(n, d);
const es = evalLevel(solved(A)), ea = evalLevel(A);
const [mn, mx] = DIFFS[d].size.split('–').map(z => z.split('×').map(Number));
const sizeOk = A.C * A.H >= mn[0] * mn[1] && A.C <= mx[0] && A.H <= mx[1];

}
ok('Лёгкая и Сложная: 150 уровней каждая — решаемы, один номер = один уровень, поле в рамке', !dBad.length, dBad.slice(0, 6).join(' '));
const nets = (n, d) => genLevel(n, d).tiles.filter(q => q.type === 'sink').length;
ok('сложности различаются: ур. 30 — лёгкая меньше обычной, сложная больше',
genLevel(30, 'easy').C * genLevel(30, 'easy').H < genLevel(30).C * genLevel(30).H &&
genLevel(30, 'hard').C * genLevel(30, 'hard').H > genLevel(30).C * genLevel(30).H &&
nets(50, 'hard') > nets(50, 'easy'));
const blk = (a, b, need) => evalLevel(mk(3, 2, base.map(r => r[0] === 0 && r[2] === 'src' ? [0, 0, 'src', 2, a]
: r[0] === 2 ? [2, 0, 'src', 8, b] : r[2] === 'sink' ? [1, 1, 'sink', 1, need] : r))).win;
ok('чёрный: красный + чёрный -> бордовый, белый + чёрный -> серый, жёлтый + чёрный -> оливковый',
blk(1, 16, 17) && blk(8, 16, 24) && blk(2, 16, 18) && !blk(1, 16, 1));
ok('тёмно-красный + тёмно-синий -> тёмно-фиолетовый, розовый + голубой -> светло-фиолетовый',
blk(17, 20, 21) && blk(9, 12, 13) && cname(21) === t('c21'));
ok('все 32 набора красок имеют цвет и имя', Array.from({ length: 31 }, (_, i) => i + 1).every(c => PAL[c] && cname(c)));
const fl = (src, f, need) => {

return evalLevel(A);
};
const f1 = fl(3, 1, 1), f2 = fl(4, 1, 4);

let fBad = [], fSeen = 0;
for (let n = 21; n <= 60; n++) {

}

ok('фильтров нет в Лёгкой и Обычной (1–150)',

ok('строки: у EN и ES есть всё, что у RU', langOk);

return (fail.length ? 'ОШИБКИ: ' + fail.length + ' из ' + res.length : 'ВСЁ OK (' + res.length + ')') + ' ' + sum;
}

}
