<script>
(function () {
var NL = String.fromCharCode(10);
var box = null;
function say(t) {
if (!box) {
box = document.createElement('pre');
box.style.cssText = 'position:fixed;left:0;top:0;right:0;z-index:9999;' +
'margin:0;padding:8px;background:#310c0c;color:#ffb4b4;' +
'font:12px/1.45 monospace;white-space:pre-wrap;' +
'max-height:70vh;overflow:auto;border-bottom:1px solid #a33';
(document.body || document.documentElement).appendChild(box);
box.textContent = 'ЧТО-ТО СЛОМАЛОСЬ' + NL +
'адрес: ' + location.protocol + '//' +
(location.host || '(локальный файл)') + NL +
'браузер: ' + navigator.userAgent + NL + NL;
}
box.textContent += t + NL;
}
window.addEventListener('error', function (e) {
say('ОШИБКА: ' + (e.message || (e.error && e.error.message) || e.type) +
NL + '   строка ' + (e.lineno || '?') + ':' + (e.colno || '?'));
});
window.addEventListener('unhandledrejection', function (e) {
var r = e.reason;
say('ОБЕЩАНИЕ ОТВАЛИЛОСЬ: ' + ((r && r.message) || r));
});
})();
